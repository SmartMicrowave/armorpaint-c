name: Build Windows Binary

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Generate Visual Studio Project
      working-directory: paint
      shell: cmd
      run: ..\base\make

    - name: Build Solution
      working-directory: paint
      shell: cmd
      run: |
        echo Locating solution file...
        for /r %%i in (*.sln) do (
          echo Found: %%i
          msbuild "%%i" /p:Configuration=Release /p:Platform=x64
          if errorlevel 1 exit /b 1
          goto :build_done
        )
        echo ERROR: No .sln file found. Printing directory structure for debugging:
        tree /F
        exit /b 1
        :build_done

    - name: Package Artifacts
      working-directory: paint
      shell: pwsh
      run: |
        $exe = Get-ChildItem -Path . -Filter "*.exe" -Recurse | Where-Object { $_.FullName -match "Release" -and ($_.Name -match "ArmorPaint" -or $_.Name -match "Krom") } | Select-Object -First 1
        
        if ($exe) {
            $outDir = "..\build-output"
            New-Item -ItemType Directory -Force -Path $outDir
            Copy-Item -Path "$($exe.Directory.FullName)\*" -Destination $outDir -Recurse -Force
            
            $dataDir = Get-ChildItem -Path . -Directory -Filter "krom" -Recurse | Select-Object -First 1
            if ($dataDir) {
               Copy-Item -Path "$($dataDir.FullName)\*" -Destination $outDir -Recurse -Force
            }
        } else {
            Write-Error "Could not find compiled Release executable."
            exit 1
        }

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: ArmorPaint-Windows-x64
        path: build-output/
