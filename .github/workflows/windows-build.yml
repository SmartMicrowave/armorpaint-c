name: Build Windows Binary

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Generate Visual Studio Project
      working-directory: paint
      shell: cmd
      run: ..\base\make

    - name: Build Solution
      working-directory: paint\build
      shell: pwsh
      run: |
        $sln = Get-ChildItem *.sln | Select-Object -First 1
        if (-not $sln) {
          Write-Error "Could not find any .sln file in the build directory."
          exit 1
        }
        Write-Host "Building solution: $($sln.Name)"
        msbuild $sln.Name /p:Configuration=Release /p:Platform=x64

    - name: Package Artifacts
      working-directory: paint\build
      shell: cmd
      run: |
        mkdir build-output
        xcopy /E /I x64\Release build-output

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: ArmorPaint-Windows-x64
        path: paint/build/build-output/
