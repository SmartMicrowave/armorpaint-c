name: Build Windows Binary

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Generate Visual Studio Project
      working-directory: paint
      shell: cmd
      run: ..\base\make --graphics vulkan

    - name: Build Solution
      working-directory: paint\build
      shell: cmd
      # The PlatformToolset flag forces MSBuild to use ClangCL instead of MSVC
      run: msbuild ArmorPaint.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=ClangCL

    - name: Package Artifacts
      working-directory: paint
      shell: pwsh
      run: |
        $outDir = "..\build-output"
        New-Item -ItemType Directory -Force -Path $outDir
        
        # Grab the EXE and any generated DLLs in the Release directory
        $exe = Get-ChildItem -Path build -Filter "*.exe" -Recurse | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
        if ($exe) {
            Copy-Item -Path "$($exe.Directory.FullName)\*" -Destination $outDir -Force
        } else {
            Write-Error "Could not find compiled .exe file."
            exit 1
        }
        
        # Package the data folder
        if (Test-Path "build\out\data") {
            $targetDataDir = Join-Path $outDir "data"
            New-Item -ItemType Directory -Force -Path $targetDataDir
            Copy-Item -Path "build\out\data\*" -Destination $targetDataDir -Recurse -Force
        } else {
            Write-Error "Could not find asset data folder."
            exit 1
        }

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: ArmorPaint-Windows-x64
        path: build-output/
